# codemagic.yaml — KUBIKA TOWER 3D (Unity 6000.5.8f1) build Android
# Output: universal APK (ARMv7+ARM64, IL2CPP) + AAB (Google Play)
# Lisensi: Unity PERSONAL (gratis). Aktivasi .alf/.ulf DIBUAT LEWAT CODEMAGIC (tanpa Unity lokal).
# Unity versi 6000.5.8f1 di-INSTALL OTOMATIS saat build (tidak pre-installed di Codemagic).
# Referensi: https://docs.codemagic.io/knowledge-others/install-unity-version/

workflows:

  # ============================================================
  # WORKFLOW 1 - Jalankan SEKALI untuk membuat file aktivasi .alf
  # Hasil: file *.alf muncul di artefak build. Download, lalu
  # aktivasi manual di https://license.unity3d.com/manual (bisa dari HP)
  # untuk mendapatkan file .ulf. Tidak perlu variabel apa pun.
  # ============================================================
  unity-activation:
    name: (1x) Unity Personal - Buat file aktivasi .alf
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Install Unity (sesuai ProjectVersion.txt)
        script: |
          #!/usr/bin/env sh
          set -e
          UNITY_VERSION=$(sed -n '1p' ProjectSettings/ProjectVersion.txt | cut -d' ' -f2)
          UNITY_CHANGESET=$(sed -n '2p' ProjectSettings/ProjectVersion.txt | sed -E 's/.*\(([0-9a-f]+)\).*/\1/')
          echo "Unity ${UNITY_VERSION} (${UNITY_CHANGESET})"
          echo "UNITY_HOME=/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app" >> "$CM_ENV"
          UNITY_HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
          if [ ! -x "/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" ]; then
            "$UNITY_HUB" -- --headless install --version "${UNITY_VERSION}" --changeset "${UNITY_CHANGESET}" || true
          fi
          if [ ! -x "/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" ]; then
            echo "ERROR: Unity ${UNITY_VERSION} gagal terpasang."; exit 1
          fi
      - name: Buat manual activation file (.alf)
        script: |
          #!/usr/bin/env sh
          echo "Membuat manual activation file (.alf)..."
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile /dev/stdout -createManualActivationFile || true
          echo "== File .alf yang dihasilkan: =="
          ls -la *.alf 2>/dev/null || echo "Tidak menemukan .alf - cek log di atas."
    artifacts:
      - "*.alf"

  # ============================================================
  # WORKFLOW 2 - Build APK universal + AAB (butuh UNITY_ULF sudah diset)
  # ============================================================
  kubika-android:
    name: KUBIKA Tower 3D - Android (APK + AAB)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity       # UNITY_ULF (isi file .ulf) atau UNITY_ULF_B64
        - keystore    # CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      vars:
        PACKAGE_NAME: "com.skstore.kubikatower3d"
        VERSION_NAME: "1.0.0"
    scripts:
      - name: Install Unity + modul Android (sesuai ProjectVersion.txt)
        script: |
          #!/usr/bin/env sh
          set -e
          UNITY_VERSION=$(sed -n '1p' ProjectSettings/ProjectVersion.txt | cut -d' ' -f2)
          UNITY_CHANGESET=$(sed -n '2p' ProjectSettings/ProjectVersion.txt | sed -E 's/.*\(([0-9a-f]+)\).*/\1/')
          echo "Unity ${UNITY_VERSION} (${UNITY_CHANGESET})"
          echo "UNITY_HOME=/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app" >> "$CM_ENV"
          UNITY_HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"
          if [ ! -x "/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" ]; then
            "$UNITY_HUB" -- --headless install --version "${UNITY_VERSION}" --changeset "${UNITY_CHANGESET}" \
              -m android -m android-sdk-ndk-tools -m android-open-jdk --childModules || true
          else
            "$UNITY_HUB" -- --headless install-modules --version "${UNITY_VERSION}" \
              -m android -m android-sdk-ndk-tools -m android-open-jdk --childModules || true
          fi
          if [ ! -x "/Applications/Unity/Hub/Editor/${UNITY_VERSION}/Unity.app/Contents/MacOS/Unity" ]; then
            echo "ERROR: Unity ${UNITY_VERSION} gagal terpasang."; exit 1
          fi
      - name: Siapkan keystore
        script: |
          #!/usr/bin/env sh
          set -e
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/kubika.keystore"
            echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/kubika.keystore" >> "$CM_ENV"
            echo "Keystore siap."
          else
            echo "PERINGATAN: CM_KEYSTORE kosong - hasil build tidak ditandatangani rilis."
          fi
      - name: Aktivasi lisensi Unity (Personal / .ulf)
        script: |
          #!/usr/bin/env sh
          set -e
          if [ -n "$UNITY_ULF_B64" ]; then
            echo "$UNITY_ULF_B64" | base64 --decode > "$CM_BUILD_DIR/Unity_lic.ulf"
          elif [ -n "$UNITY_ULF" ]; then
            printf '%s' "$UNITY_ULF" > "$CM_BUILD_DIR/Unity_lic.ulf"
          else
            echo "ERROR: set UNITY_ULF (isi file .ulf) atau UNITY_ULF_B64. Jalankan dulu workflow 'unity-activation'."
            exit 1
          fi
          # -manualLicenseFile sering keluar exit-code != 0 walau sukses, jadi pakai '|| true'
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile /dev/stdout \
            -manualLicenseFile "$CM_BUILD_DIR/Unity_lic.ulf" || true
      - name: Build APK universal + AAB
        script: |
          #!/usr/bin/env sh
          set -e
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -nographics -logFile /dev/stdout \
            -projectPath "$CM_BUILD_DIR" \
            -buildTarget Android \
            -executeMethod BuildScript.BuildAndroid
    artifacts:
      - build/android/*.apk
      - build/android/*.aab
      - build/android/**/*.symbols.zip
      - $CM_BUILD_DIR/**/Logs/**/*.log
    publishing:
      email:
        recipients:
          - rizky.saja059@gmail.com
        notify:
          success: true
          failure: true
