# codemagic.yaml — KUBIKA TOWER 3D (Unity 6000.5.8f1) build Android
# Output: universal APK (ARMv7+ARM64, IL2CPP) + AAB (Google Play)
# Lisensi: Unity PERSONAL (gratis). Aktivasi .alf/.ulf DIBUAT LEWAT CODEMAGIC (tanpa Unity lokal).
# Referensi: https://docs.codemagic.io/yaml-quick-start/building-a-unity-app/

workflows:

  # ============================================================
  # WORKFLOW 1 - Jalankan SEKALI untuk membuat file aktivasi .alf
  # Hasil: file *.alf muncul di artefak build. Download, lalu
  # aktivasi manual di https://license.unity3d.com/manual (bisa dari HP)
  # untuk mendapatkan file .ulf.
  # ============================================================
  unity-activation:
    name: (1x) Unity Personal - Buat file aktivasi .alf
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity           # cukup UNITY_HOME untuk langkah ini
      vars:
        UNITY_BIN: ${UNITY_HOME}/Contents/MacOS/Unity
    scripts:
      - name: Buat manual activation file (.alf)
        script: |
          #!/usr/bin/env sh
          echo "Membuat manual activation file (.alf)..."
          ${UNITY_BIN} -batchmode -quit -nographics -logFile /dev/stdout -createManualActivationFile || true
          echo "== File .alf yang dihasilkan: =="
          ls -la *.alf 2>/dev/null || echo "Tidak menemukan .alf - cek log di atas."
    artifacts:
      - "*.alf"

  # ============================================================
  # WORKFLOW 2 - Build APK universal + AAB (butuh UNITY_ULF sudah diset)
  # ============================================================
  kubika-android:
    name: KUBIKA Tower 3D - Android (APK + AAB)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - unity       # UNITY_HOME + UNITY_ULF (atau UNITY_ULF_B64)
        - keystore    # CM_KEYSTORE (base64), CM_KEYSTORE_PASSWORD, CM_KEY_ALIAS, CM_KEY_PASSWORD
      vars:
        UNITY_BIN: ${UNITY_HOME}/Contents/MacOS/Unity
        PACKAGE_NAME: "com.skstore.kubikatower3d"
        VERSION_NAME: "1.0.0"
    scripts:
      - name: Siapkan keystore
        script: |
          #!/usr/bin/env sh
          set -e
          if [ -n "$CM_KEYSTORE" ]; then
            echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/kubika.keystore"
            echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/kubika.keystore" >> "$CM_ENV"
            echo "Keystore siap."
          else
            echo "PERINGATAN: CM_KEYSTORE kosong - hasil build tidak ditandatangani rilis."
          fi
      - name: Aktivasi lisensi Unity (Personal / .ulf)
        script: |
          #!/usr/bin/env sh
          set -e
          if [ -n "$UNITY_ULF_B64" ]; then
            echo "$UNITY_ULF_B64" | base64 --decode > "$CM_BUILD_DIR/Unity_lic.ulf"
          elif [ -n "$UNITY_ULF" ]; then
            printf '%s' "$UNITY_ULF" > "$CM_BUILD_DIR/Unity_lic.ulf"
          else
            echo "ERROR: set UNITY_ULF (isi file .ulf) atau UNITY_ULF_B64. Jalankan dulu workflow 'unity-activation'."
            exit 1
          fi
          # -manualLicenseFile sering keluar exit-code != 0 walau sukses, jadi pakai '|| true'
          ${UNITY_BIN} -batchmode -quit -nographics -logFile /dev/stdout \
            -manualLicenseFile "$CM_BUILD_DIR/Unity_lic.ulf" || true
      - name: Build APK universal + AAB
        script: |
          #!/usr/bin/env sh
          set -e
          ${UNITY_BIN} -batchmode -quit -nographics -logFile /dev/stdout \
            -projectPath "$CM_BUILD_DIR" \
            -buildTarget Android \
            -executeMethod BuildScript.BuildAndroid
    artifacts:
      - build/android/*.apk
      - build/android/*.aab
      - build/android/**/*.symbols.zip
      - $CM_BUILD_DIR/**/Logs/**/*.log
    publishing:
      email:
        recipients:
          - rizky.saja059@gmail.com
        notify:
          success: true
          failure: true
